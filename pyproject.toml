[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dadmm-localization"
version = "0.1.0"
description = "Playground for distributed target localization with DADMM using ToA measurements and unknown emission time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "casadi>=3.6",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "pre-commit>=3.7",
]
analysis = [
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
]

[project.scripts]
dadmm-localization = "dadmm_localization.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
