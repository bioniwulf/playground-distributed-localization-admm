repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest-smoke
        entry: pytest -q tests/test_experiments_smoke.py
        language: system
        pass_filenames: false

